[project]
name = "conjunto-ai"
version = "2.0.0"
description = "AI Orchestrator for Conjunto Intelligent Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "tenacity>=9",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "shapely>=2.0",
    "trimesh>=4.4",
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
]

[project.optional-dependencies]
llm = ["openai>=1.50", "anthropic>=0.34"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
neural = ["onnxruntime>=1.19"]
training = ["torch>=2.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "shapely",
    "shapely.*",
    "onnxruntime",
    "onnxruntime.*",
    "pytesseract",
    "pytesseract.*",
    "fitz",
    "fitz.*",
]
ignore_missing_imports = true
