[alembic]
script_location = backend/migrations
# sqlalchemy.url is deliberately NOT set here — env.py reads it from
# Settings (backend.app.config.get_settings().database_url), the same
# source every other part of the app uses. Hardcoding a URL (with
# credentials) into a checked-in .ini file is exactly the kind of thing
# this project's own SECRET_KEY-in-.env discipline is meant to avoid.
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
