# ==========================================================
# Conjunto Inteligente · Stack completo
# Levantar todo:      docker compose up -d
# Levantar solo core: docker compose --profile core up -d
# Ver estado:         docker compose ps
# Logs de uno:        docker compose logs -f api
# ==========================================================

name: ${COMPOSE_PROJECT_NAME:-conjunto}

# ─────────────────────────────────────────────────────────
# Redes aisladas por dominio
# ─────────────────────────────────────────────────────────
networks:
  data:
    driver: bridge
    internal: false          # postgres, rabbit, redis, minio
  core:
    driver: bridge
    internal: false          # api, ai, pb-bridge, web-admin
  edge:
    driver: bridge
    internal: false          # mosquitto, edge
  obs:
    driver: bridge
    internal: false          # otel, prometheus, grafana, loki, tempo

# ─────────────────────────────────────────────────────────
# Volúmenes persistentes
# ─────────────────────────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  mosquitto-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  edge-data:

# ─────────────────────────────────────────────────────────
# Servicios
# ─────────────────────────────────────────────────────────
services:

  # =======================================================
  # DATA
  # =======================================================

  postgres:
    image: postgres:16-alpine
    container_name: conjunto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-alpine
    container_name: conjunto-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: conjunto-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
      TZ: ${TZ}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MGMT_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [data, core]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  minio:
    image: minio/minio:latest
    container_name: conjunto-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    networks: [data, core]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # =======================================================
  # EDGE
  # =======================================================

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: conjunto-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT}:1883"
      - "${MQTT_WS_PORT}:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    networks: [edge, core]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 2 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  edge:
    build:
      context: ./edge
      dockerfile: Dockerfile
    image: conjunto/edge-gateway:latest
    container_name: conjunto-edge
    restart: unless-stopped
    environment:
      EDGE__MQTT_HOST: mosquitto
      EDGE__MQTT_PORT: "1883"
      EDGE__MQTT_TOPIC: "conjunto/+/events"
      EDGE__MQTT_QOS: "1"
      EDGE__MQTT_CLIENT_ID: "edge-gateway-01"
      EDGE__FORWARD_URL: "http://ai:8000/analyze/reception"
      EDGE__BUFFER_PATH: "/data/edge-events.db"
      EDGE__BATCH_SIZE: "50"
      EDGE__FLUSH_INTERVAL_MS: "1000"
      EDGE__INITIAL_BACKOFF_MS: "500"
      EDGE__MAX_BACKOFF_MS: "30000"
      EDGE__HEALTH_PORT: "8080"
      EDGE__LOG_LEVEL: "${EDGE_LOG_LEVEL}"
    ports:
      - "${EDGE_HEALTH_PORT}:8080"
    volumes:
      - edge-data:/data
    networks: [edge, core]
    depends_on:
      mosquitto:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # =======================================================
  # CORE
  # =======================================================

  api:
    build:
      context: .
      dockerfile: src/Api/ConjuntoInteligente.Api/Dockerfile
    image: conjunto/api:latest
    container_name: conjunto-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Redis__Connection: "redis:6379,password=${REDIS_PASSWORD}"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__User: "${RABBITMQ_USER}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      S3__Endpoint: "http://minio:9000"
      S3__AccessKey: "${MINIO_ROOT_USER}"
      S3__SecretKey: "${MINIO_ROOT_PASSWORD}"
      S3__Bucket: "${MINIO_BUCKET}"
      Otel__Endpoint: "http://otel-collector:4317"
      AI__Url: "http://ai:8000"
    ports:
      - "${API_PORT}:5000"
    networks: [core, data, obs]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    image: conjunto/ai:latest
    container_name: conjunto-ai
    restart: unless-stopped
    environment:
      AI__SERVICE_NAME: conjunto-ai
      AI__ENV: production
      AI__LLM_PROVIDER: ${AI_LLM_PROVIDER}
      AI__LLM_MODEL: ${AI_LLM_MODEL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: conjunto-ai
      CORE__BASE_URL: "http://api:5000"
      POLICY__AUTO_APPROVE_MAX_COP: "500000"
      POLICY__REQUIRE_MULTI_QUOTE_MIN_COP: "2000000"
      POLICY__REQUIRE_ADMIN_APPROVAL_SEVERITIES: "critical,high"
    ports:
      - "${AI_PORT}:8000"
    networks: [core, obs]
    depends_on:
      api:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 25s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  pb-bridge:
    build:
      context: ./legacy/powerbuilder-admin/bridge
      dockerfile: Dockerfile
    image: conjunto/pb-bridge:latest
    container_name: conjunto-pb-bridge
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5100"
      PB__ServiceToken: ${PB_SERVICE_TOKEN}
      Core__BaseUrl: "http://api:5000"
      Core__ServiceToken: ""
      Core__TenantId: ""
      Otel__Endpoint: "http://otel-collector:4317"
    ports:
      - "${PB_BRIDGE_PORT}:5100"
    networks: [core, obs]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5100/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web-admin:
    build:
      context: ./frontend/web-admin
      dockerfile: Dockerfile
    image: conjunto/web-admin:latest
    container_name: conjunto-web-admin
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: "/api"
    ports:
      - "${WEB_ADMIN_PORT}:80"
    networks: [core]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # =======================================================
  # OBSERVABILIDAD
  # =======================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: conjunto-otel
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT}:4317"    # OTLP gRPC
      - "${OTEL_HTTP_PORT}:4318"    # OTLP HTTP
      - "8888:8888"                 # métricas propias del collector
    networks: [obs, core, edge]
    depends_on:
      - tempo
      - loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: conjunto-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks: [obs]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  loki:
    image: grafana/loki:3.1.1
    container_name: conjunto-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    ports:
      - "${LOKI_PORT}:3100"
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks: [obs]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  tempo:
    image: grafana/tempo:2.6.1
    container_name: conjunto-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "${TEMPO_PORT}:3200"
      - "${TEMPO_OTLP_GRPC_PORT}:4317"    # OTLP gRPC interno
      - "${TEMPO_OTLP_HTTP_PORT}:4318"    # OTLP HTTP interno
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [obs]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  grafana:
    image: grafana/grafana:11.2.2
    container_name: conjunto-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_INSTALL_PLUGINS: ""
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [obs]
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # =======================================================
  # Perfiles opcionales (no se levantan por defecto)
  # =======================================================

  adminer:
    image: adminer:4.8.1
    container_name: conjunto-adminer
    restart: unless-stopped
    profiles: [tools]
    ports:
      - "8081:8080"
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: conjunto-mailhog
    restart: unless-stopped
    profiles: [tools]
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI
    networks: [core]
