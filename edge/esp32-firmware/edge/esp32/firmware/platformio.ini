; ============================================================
; PlatformIO · Conjunto Inteligente · Firmware ESP32
; ============================================================

[platformio]
default_envs = esp32dev

[common]
framework = espidf
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
upload_speed = 921600
test_ignore = test_desktop_only

; ── Base ESP-IDF ────────────────────────────────────────────
[env:base]
platform = espressif32@6.13.0
board = esp32dev_2mb
framework = espidf
board_upload.flash_size = 2MB
board_build.partitions = partitions.csv
build_flags =
    -DESP32_TARGET=1
    -DCONFIG_FREERTOS_HZ=1000
    -Wall
    -Wextra
    -Werror
    -Wno-unused-parameter
    -Wno-missing-field-initializers
    -Iinclude
build_unflags =
    -Wno-error=unused-variable

; ── Desarrollo (con logs verbose) ──────────────────────────
[env:esp32dev]
extends = env:base
build_type = debug
build_flags =
    ${env:base.build_flags}
    -DFW_ENV=dev
    -DCORE_DEBUG_LEVEL=4
    -DESP_LOGGING_VERBOSE=1

; ── Sensores de conjunto (DHT22, DS18B20, flotador, ACS712,
;    presión analógica y PZEM-004T v3.0) ───────────────────
[env:esp32dev-sensors]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DINSTALLATION_SENSOR_MODE=1

; ── Release firmado (OTA) ──────────────────────────────────
[env:esp32dev-release]
extends = env:base
build_type = release
board_build.partitions = partitions.release.csv
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.esp32dev-release
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.release
build_flags =
    ${env:base.build_flags}
    -DFW_ENV=release
    -DFW_RELEASE_BUILD=1
    -DCORE_DEBUG_LEVEL=2
extra_scripts =
    post:scripts/sign_firmware.py

; ── Wokwi (simulación) ─────────────────────────────────────
[env:wokwi]
extends = env:esp32dev
board = esp32dev_2mb
build_flags =
    ${env:esp32dev.build_flags}
    -DWOKWI_SIM=1
    -DWIFI_SSID=\"Wokwi-GUEST\"
    -DWIFI_PASS=\"\"

; ── Tests nativos (sin hardware) ───────────────────────────
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++20
    -Wall
    -Wextra
    -Werror
    -DNATIVE_TEST=1
    -Iinclude
    -Isrc
    -Isrc/sensors
test_build_src = yes
build_src_filter =
    -<*>
    +<backoff.cpp>
    +<sensors/sensor_base.cpp>
test_filter = test_*
